# YOLO & Thermal Detection Configuration
model:
  name: "models/best.pt"
  input_size: 640
  device: "cuda"  # NVIDIA RTX 4070 GPU acceleration
  half: true      # FP16 Tensor Core acceleration

thresholds:
  confidence: 0.35
  iou: 0.45

thermal_preprocessing:
  enable_clahe: true
  clip_limit: 2.0
  tile_grid_size: [8, 8]

classes:
  allowed_ids: [0, 1, 2, 3, 5, 7]
  class_mapping:
    0: "gun"
    1: "person"
    2: "vehicle"
    3: "armed_person"
    5: "vehicle"
    7: "vehicle"
