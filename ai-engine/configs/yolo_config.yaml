# YOLO Detection Configuration
model:
  name: "yolov8n.pt"
  input_size: 640
  device: "auto" # 'cuda', 'cpu', or 'auto'
  half: true     # FP16 inference on GPU

thresholds:
  confidence: 0.50
  iou: 0.45

classes:
  allowed_ids: [0, 2, 5, 7, 16] # 0: person, 2: car, 5: bus, 7: truck, 16: dog
  class_mapping:
    0: "person"
    2: "vehicle"
    5: "vehicle"
    7: "vehicle"
    16: "animal"
